name: Deploy Backend

on:
  push:
    branches: [ staging ]
    paths-ignore:
      - './packages/frontend/**'

env:
  IS_DEPLOING: ${{ contains(github.event.head_commit.message, '#backendPatch') }}

jobs:
  deploy:
    if: ${{ contains(github.event.head_commit.message, '#backendPatch') }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Install Node.js (for Railway CLI)
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: |
          npm install -g @railway/cli

      - name: Build and deploy to Railway
        if: ${{ contains(github.event.head_commit.message, '#backendPatch') }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service=pet-monorepo
