name: Deploy Backend

on:
  push:
    branches: [ dev ]
    paths-ignore:
      - 'packages/frontend/**'

env:
  IS_DEPLOING: ${{ contains(github.event.commits[0].message, '#backendPatch') }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Install Node.js (for Railway CLI)
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: |
          npm install -g @railway/cli
      
      - name: Build and deploy to Railway
        env:
          SVC_ID: eac090f9-4163-4801-8257-4ebba3ef8e40
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service=${{ env.SVC_ID }}
