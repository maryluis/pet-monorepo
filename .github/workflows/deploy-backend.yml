name: Deploy Backend

on:
  push:
    branches: [ dev ]
    paths-ignore:
      - 'packages/frontend/**'

env:
  IS_DEPLOING: ${{ contains(github.event.commits[0].message, '#backendPatch') }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Install Railway CLI
        run: |
          curl -sSL https://railway.app/cli | bash
      
      - name: Build and deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --build
